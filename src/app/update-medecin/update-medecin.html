<div class="container">
  <div>
    <h2>Modifier un Médecin :</h2>
  </div>
  <form (ngSubmit)="updateMedecin()">
    <div class="col-sm-2 col-md-2 col-lg-2">
      <label>ID Médecin</label>
      <input readonly type="text" [(ngModel)]="currentMedecin.id" name="id" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Nom</label>
      <input type="text" [(ngModel)]="currentMedecin.nom" name="nom" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Prénom</label>
      <input type="text" [(ngModel)]="currentMedecin.prenom" name="prenom" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Email</label>
      <input type="text" [(ngModel)]="currentMedecin.email" name="email" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Téléphone</label>
      <input type="text" [(ngModel)]="currentMedecin.telephone" name="telephone" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Date Diplôme</label>
      <input type="date" [ngModel]="currentMedecin.dateDiplome | date:'yyyy-MM-dd'"
        (ngModelChange)="onDateChange($event)" name="dateDiplome" class="form-control">
    </div>

    <div class="col-sm-4 col-md-4 col-lg-4">
      <label>Spécialité</label>
      <select class="form-control form-control-lg" id="idSpec" name="idSpec" [(ngModel)]="updatedSpecId">
        @for(spec of specialites; track spec.id)
        {
          <option [value]="spec.id"> {{ spec.nom }} </option>
        }
      </select>
    </div>

    <div class="mt-2">
      <button type="submit" class="btn btn-success">Modifier</button>
    </div>
  </form>
</div>
