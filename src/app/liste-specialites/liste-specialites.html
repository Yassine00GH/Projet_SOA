<div class="container mt-3">
  <div class="col-sm-4 col-md-4 col-lg-4 mb-4">
    <app-update-specialite
      [specialite]="updatedSpec"
      (specialiteUpdated)="specialiteUpdated($event)"
      [ajout]="ajout">
    </app-update-specialite>
  </div>

  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Id</th>
            <th>Nom Spécialité</th>
            <th>Description</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          @for (spec of specialites; track spec.id) {
            <tr>
              <td>{{spec.id}}</td>
              <td>{{spec.nom}}</td>
              <td>{{spec.description}}</td>
              <td><a class="btn btn-success" (click)="updateSpec(spec)">Editer</a></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
